workflows:
  android-release:
    name: RAMS - Android Release APK
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      flutter: stable
      # No ios/ folder exists in this project on purpose — RAMS is
      # Android-only, so this workflow never touches Xcode/iOS at all.

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Build release APK
        script: flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
