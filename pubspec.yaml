name: rams_app
description: Reliance Attendance Management System (RAMS) - Offline Android app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Local SQLite database (fully offline)
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3

  # State management (simple, no extra boilerplate)
  provider: ^6.1.2

  # Date formatting / helpers
  intl: ^0.19.0

  # Export to Excel (.xlsx)
  excel: ^4.0.6

  # Export to PDF
  pdf: ^3.11.3
  printing: ^5.14.2

  # Share / save exported files & backups
  share_plus: ^9.0.0

  # File picking for Restore Backup
  file_picker: ^8.0.6

  # Secure-ish password hashing for login
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Generates all app icon sizes automatically from assets/icon/app_icon.png
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
