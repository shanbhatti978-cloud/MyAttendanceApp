name: Build RAMS Android APK

# Runs automatically every time you push to "main", and can also be
# triggered manually from the Actions tab ("Run workflow" button).
# This is completely free on GitHub — public repos get unlimited
# minutes, private repos get 2000 free minutes/month, no card needed.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java (required by Android Gradle build)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get Flutter packages
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      # Uploads the finished APK so you can download it from the
      # finished workflow run, under "Artifacts".
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RAMS-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
